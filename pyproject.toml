[project]
name = "sam3-video-cvf"
version = "0.1.0"
description = "SAM 3 video-tracker (memory encoder + memory attention) fine-tuning on CVF-2026 smoke masklets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # torch/torchvision and the editable ./sam3 checkout are resolved through
    # [tool.uv.sources] below. Mirrors sam3-finetuned-cvf's setup so the two
    # repos stay independent checkouts rather than one importing the other.
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.26,<2",          # sam3 requires numpy<2
    "pycocotools>=2.0.7",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "setuptools<82",
    "einops>=0.8.2",
    "psutil>=7.0",
    "torch>=2.6,<2.13",
    "torchvision",
    "sam3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smokeftv"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
sam3 = { path = "./sam3", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
