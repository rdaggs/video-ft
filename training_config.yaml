# training_config.yaml — the snapshot for sam3-video-cvf.
#
# Video analogue of sam3-finetuned-cvf/config_all.yaml. Same contract:
#   - it is a snapshot, not a resolver; `divergences` records disagreement
#   - `python -m smokeftv.config_all --check` proves every value equals its
#     consumer's value, and that check is the contract
#   - per-run knobs (lr, epochs, freeze schedule, dropout distribution) live in
#     configs/train_video.yaml and nowhere else
#   - ckpts/<run>/config_resolved.yaml strips `extends` and is a literal record
#
# Rule of thumb: anything that changes WHICH SAMPLES EXIST or WHAT A METRIC
# MEANS belongs here. Anything a run varies does not.

meta:
  snapshot_date: 2026-09-24
  sam3_video_cvf_sha: null          # filled by scripts/stamp_meta.py
  sam3_finetuned_cvf_sha: 7000faa   # the repo this one is ported from
  poc_sha: 8a63ee2
  poc_geometry_sha256: b7b96e719ed072ad
  poc_config_sha256: f80db0dd8c416439
  # Image-mode checkpoint the video tracker initialises from. load_overlays
  # raises on architecture mismatch.
  # ckpts_best/, not ckpts/ — ckpts/L4E-2 does not exist. 66 tensors, 62.58M
  # params, all under `backbone.vision_backbone.*` (trunk blocks 28-31 +
  # sam2_convs 0-2). Verified to load onto build_tracker(with_backbone=True)
  # with zero unexpected keys and zero shape mismatches, so no key remap.
  init_from: /home/rileydaggs/projects/sam3-finetuned-cvf/ckpts_best/L4E-2/best.pt
  # bbox_repair.py is UNTRACKED in sam3-finetuned-cvf, so there is no commit to
  # name. The eval baseline below was produced by it; hash it instead.
  bbox_repair_sha256: 022ac4924c2587b4

# --------------------------------------------------------------------------- #
# shared — ported verbatim; every consumer reads these and they must agree
# --------------------------------------------------------------------------- #
shared:
  data_root: /home/rileydaggs/data/cvf-2026
  sam_version: sam3

  # CLAHE runs on the FULL FRAME BEFORE the crop is taken. It is a local-contrast
  # operator; running it on a crop produces different pixels.
  clahe: true
  clahe_clip: 2.0
  clahe_grid: 8

  multimask: true
  fuse_top_k: 3
  fuse_mode: soft
  max_fill_frac: 0.9

